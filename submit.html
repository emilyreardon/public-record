ntantes: ___."},{"id":114,"type":"Core","title":"Federalist No. 85: Concluding Remarks","prompt":"Write a demand. This document was the final argument for ratifying the Constitution. Ratification passed. Now, 237 years later, what do you think needs to be ratified, amended, or rewritten? Write your demand and submit it.","do":"Draft Amendment 28. One sentence.","submit_template":"The best time to fix the Constitution is before a crisis, not during one. I want my representatives to hold a national debate about what the Constitution still needs to say.","desc_en":"One of 85 essays arguing for the new Constitution. Alexander Hamilton argued a Bill of Rights was unnecessary - the Constitution itself protected rights. The Anti-Federalists disagreed and won. The Bill of Rights was added. Hamilton was wrong.","desc_es":"Uno de 85 ensayos que argumentan a favor de la nueva Constitución. Alexander Hamilton argumentó que una Declaración de Derechos era innecesaria - la Constitución misma protegía los derechos. Los Anti-Federalistas estuvieron en desacuerdo y ganaron. La Declaración de Derechos fue añadida. Hamilton estaba equivocado.","do_en":"","do_es":"Estás redactando la Enmienda 28. Hamilton dijo que una Declaración de Derechos era innecesaria. Perdió. Si pudieras añadir una enmienda más hoy, ¿cuál sería? Escríbela en una oración. Luego llévala más lejos: envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"Enmienda 28: ___\n\nMi petición a mis representantes: ___."},{"id":115,"type":"Expansive","title":"13th Amendment ratification debate","prompt":"Thaddeus Stevens fought for 40 years to abolish slavery. He did not live to see full equality. Write about someone you know who fought for something they did not live to see finished. Then write the unfinished work you would continue.","do":"Say it - out loud - to the person next to you. Then write it.","submit_template":"The 13th Amendment still allows slavery as punishment for a crime, and prisons use it every day. I want my representatives to close this loophole so no one can be forced to work for nothing.","desc_en":"The congressional debate over the 13th Amendment in 1865. Representatives argued for and against abolishing slavery. Thaddeus Stevens had waited 40 years to give his speech. Eight Democrats abstained rather than vote against it - and the amendment passed.","desc_es":"El debate del Congreso sobre la 13a Enmienda en 1865. Los representantes debatieron a favor y en contra de abolir la esclavitud. Thaddeus Stevens había esperado 40 años para dar su discurso. Ocho demócratas se abstuvieron en lugar de votar en contra - y la enmienda fue aprobada.","do_en":"","do_es":"Estás dando testimonio de una larga lucha. Stevens esperó 40 años. Algunas luchas duran más que una vida. Escribe lo que has estado esperando decir - y dilo. Luego llévalo más lejos: envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"He estado esperando decir ___\n\nMi petición a mis representantes: ___."},{"id":116,"type":"Expansive","title":"14th Amendment ratification debate","prompt":"John Bingham saw a gap in the Constitution: it promised freedom but not equal protection. Turn to the person next to you. Ask: where do you see a gap in the Constitution today, something the law should protect but does not? Write what you both see.","do":"Name the missing guarantee. Draft it in one sentence.","submit_template":"Equal protection under the law should mean the same quality of school, hospital, and road for every American. I want my representatives to enforce the 14th Amendment where it has been ignored.","desc_en":"The congressional debate over the 14th Amendment in 1866. Representative John Bingham argued the Constitution had a gap - a missing guarantee of equal protection. The amendment passed and became the most-cited in US legal history.","desc_es":"El debate del Congreso sobre la 14a Enmienda en 1866. El representante John Bingham argumentó que la Constitución tenía una laguna - una garantía faltante de protección igualitaria. La enmienda fue aprobada y se convirtió en la más citada en la historia legal de los EE. UU.","do_en":"","do_es":"Estás nombrando una laguna en la Constitución. Bingham nombró una y escribió una enmienda para llenarla. ¿Qué falta hoy? Escríbelo como una enmienda propuesta. Luego llévalo más lejos: envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"La garantía constitucional que aún necesitamos: ___\n\nMi petición a mis representantes: ___."},{"id":117,"type":"Expansive","title":"15th Amendment ratification debate","prompt":"In 1869, Congress chose the narrowest version of voting rights, leaving room for poll taxes, literacy tests, and violence. Write the broad version of a right you think the country has settled for less on. What would the full version look like?","do":"Talk to the person next to you. Submit one thing that would be different today.","submit_template":"If the broader version of the 15th Amendment had passed, voting would be easier for more people today. I want my representatives to pass a new voting rights law that protects every citizen.","desc_en":"The congressional debate over the 15th Amendment in 1869. Three versions were proposed - a broad one that would have banned literacy tests and poll taxes, a moderate one, and a narrow one. Congress chose the narrowest, and the gaps it left took nearly 100 more years to close.","desc_es":"El debate del Congreso sobre la 15a Enmienda en 1869. Se propusieron tres versiones - una amplia que habría prohibido las pruebas de alfabetización y los impuestos electorales, una moderada y una limitada. El Congreso eligió la más limitada, y las lagunas que dejó tardaron casi 100 años más en cerrarse.","do_en":"","do_es":"Estás escribiendo la versión que debería haber sido aprobada. La enmienda más amplia habría prohibido las pruebas de alfabetización y los impuestos electorales en 1869. ¿Qué sería diferente hoy si hubiera sido aprobada? Escribe lo que habrías aprobado. Luego llévalo más lejos: envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"Si la 15a Enmienda más amplia hubiera sido aprobada, ___\n\nMi petición a mis representantes: ___."},{"id":118,"type":"Expansive","title":"19th Amendment ratification debate","prompt":"Women organized for 72 years before the 19th Amendment passed. Have you ever organized for something that took a very long time? Write what it was, how long it took, and what kept you going. Or write about something you are still waiting for.","do":"Name the right. Commit, out loud, to doing one thing to advance it.","submit_template":"Women won the right to vote in 1920, but many were blocked until 1965 and some face new barriers today. I want my representatives to protect every woman's right to vote from new restrictions.","desc_en":"The congressional debate over the 19th Amendment in 1919. After 72 years of organizing and fighting, women won the right to vote. The debate in Congress was fierce - and the victory was narrow.","desc_es":"El debate del Congreso sobre la 19a Enmienda en 1919. Después de 72 años de organización y lucha, las mujeres ganaron el derecho a votar. El debate en el Congreso fue intenso - y la victoria fue ajustada.","do_en":"","do_es":"Estás haciendo una exigencia de derechos al voto. El derecho al voto es la base de la democracia. Si enfrentas una barrera para votar, puedes denunciarla. En la vida real: regístrate o verifica tu registro en vote.gov. Denuncia la supresión de votantes al Fondo de Defensa Legal de la NAACP en naacpldf.org. Escribe tu exigencia aquí. Luego envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"El derecho por el que estoy comprometida/o a luchar: ___\n\nMi petición a mis representantes: ___."},{"id":119,"type":"Expansive","title":"24th Amendment ratification debate","prompt":"People were charged a fee to vote. The fee kept poor people and Black voters out of elections on purpose. Have you ever been priced out of something you should have been able to do? Write what that was. Then write whether you think there are hidden costs to participating in democracy today.","do":"Name the cost - money, time, ID, distance, fear.","submit_template":"Any fee, fine, or ID cost that stands between a person and their vote is a poll tax, no matter what it is called. I want my representatives to make voting free and accessible for every citizen.","desc_en":"The congressional debate over the 24th Amendment in 1962. Poll taxes were fees poor people had to pay to vote - used across the South to keep Black voters out. The amendment passed and abolished them.","desc_es":"El debate del Congreso sobre la 24a Enmienda en 1962. Los impuestos electorales eran tarifas que las personas pobres tenían que pagar para votar - usadas en todo el Sur para mantener alejados a los votantes negros. La enmienda fue aprobada y los abolió.","do_en":"","do_es":"Estás haciendo una exigencia de derechos al voto. El derecho al voto es la base de la democracia. Si enfrentas una barrera para votar, puedes denunciarla. En la vida real: regístrate o verifica tu registro en vote.gov. Denuncia la supresión de votantes al Fondo de Defensa Legal de la NAACP en naacpldf.org. Escribe tu exigencia aquí. Luego envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"Lo que me cobra o le cobra a otros el costo de la democracia: ___\n\nMi petición a mis representantes: ___."},{"id":120,"type":"Expansive","title":"26th Amendment ratification debate","prompt":"Young people were drafted into war but could not vote for the leaders who sent them. Write a letter to an 18-year-old today. What do you want them to know about what was won so they could vote, and what you think they should do with it?","do":"Name who bears the consequences of decisions they have no voice in.","submit_template":"Young people are paying for climate change, student debt, and war with decisions they had no vote in. I want my representatives to lower the voting age to 16.","desc_en":"The congressional debate over the 26th Amendment in 1971. The argument was simple: if you are old enough to be drafted and die in a war, you are old enough to vote. The amendment passed in 83 days - the fastest in US history.","desc_es":"El debate del Congreso sobre la 26a Enmienda en 1971. El argumento era simple: si eres lo suficientemente mayor para ser reclutado y morir en una guerra, eres lo suficientemente mayor para votar. La enmienda fue aprobada en 83 días - la más rápida en la historia de los EE. UU.","do_en":"","do_es":"Estás exigiendo representación. Toda persona afectada por un gobierno merece tener voz en él. Los ciudadanos pueden exigir representación a través de sus funcionarios electos, la organización y la reforma constitucional. Escribe tu exigencia aquí. Luego llévala más lejos: envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"___ carga con las consecuencias de decisiones que no puede influir\n\nMi petición a mis representantes: ___."},{"id":121,"type":"Expansive","title":"Civil Rights Act of 1964, floor debate excerpts","prompt":"The Civil Rights Act of 1964 passed after years of sit-ins, marches, and deaths. Write about a time you took a risk to push for something fair, or a time you wish you had. Then write one thing the Civil Rights Act still has not fixed.","do":"Draft it in one sentence. Give it a name.","submit_template":"The Civil Rights Act made discrimination illegal but enforcement is still too weak to work. I want my representatives to fully fund the Equal Employment Opportunity Commission.","desc_en":"The floor debate over the Civil Rights Act of 1964. After years of marches, sit-ins, beatings, and deaths, Congress voted to ban discrimination in employment, housing, and public places based on race, color, religion, sex, or national origin.","desc_es":"El debate en el pleno sobre la Ley de Derechos Civiles de 1964. Después de años de marchas, sentadas, golpizas y muertes, el Congreso votó para prohibir la discriminación en el empleo, la vivienda y los lugares públicos basada en raza, color, religión, sexo u origen nacional.","do_en":"","do_es":"Estás proponiendo una ley. La Ley de Derechos Civiles ocurrió porque personas organizadas lo hicieron imposible de ignorar. ¿Qué ley necesita existir y aún no existe? Escríbela aquí. Nómbrala. Luego llévala más lejos: envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"La ley que aprobaría: [nombre]. Haría: ___\n\nMi petición a mis representantes: ___."},{"id":122,"type":"Expansive","title":"Voting Rights Act of 1965, floor debate excerpts","prompt":"The Voting Rights Act was weakened by the Supreme Court in 2013. Take a poll: ask everyone near you whether they have ever had trouble voting or registering to vote. Write the count. Then write one thing that should be done to protect voting rights right now.","do":"Talk to the person next to you. Then write: do you agree or disagree - and why, in one sentence?.","submit_template":"The Supreme Court gutted the Voting Rights Act in 2013. I want my representatives to pass a new law that restores full voting protections for every American.","desc_en":"The floor debate over the Voting Rights Act of 1965. This law gave the federal government the power to enforce voting rights - something the 15th Amendment had promised but could not deliver alone. A key part was struck down by the Supreme Court in 2013.","desc_es":"El debate en el pleno sobre la Ley de Derechos de Voto de 1965. Esta ley dio al gobierno federal el poder de hacer cumplir los derechos de voto - algo que la 15a Enmienda había prometido pero no podía cumplir sola. Una parte clave fue anulada por la Corte Suprema en 2013.","do_en":"","do_es":"Estás haciendo una exigencia de derechos al voto. El derecho al voto es la base de la democracia. Si enfrentas una barrera para votar, puedes denunciarla. En la vida real: regístrate o verifica tu registro en vote.gov. Denuncia la supresión de votantes al Fondo de Defensa Legal de la NAACP en naacpldf.org. Escribe tu exigencia aquí. Luego envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"Sobre la Ley de Derechos de Voto y el caso Shelby County: [estoy de acuerdo/en desacuerdo] porque ___\n\nMi petición a mis representantes: ___."},{"id":123,"type":"Expansive","title":"Executive Order 9066","prompt":"In 1942, the US government forced 120,000 Japanese Americans into incarceration camps. Two-thirds were US citizens. Write the name of a group you think is being treated as less than a full citizen today, and write what you would demand on their behalf.","do":"Name the group. Name the order or policy. Propose what should stop it.","submit_template":"Locking up American citizens because of their heritage was wrong in 1942 and would be wrong today. I want my representatives to pass a law preventing mass detention based on race, religion, or national origin.","desc_en":"Executive Order 9066, signed in 1942. It authorized the forced removal and imprisonment of 120,000 Japanese Americans - two-thirds of them US citizens. The Supreme Court upheld it. It was never fully overturned.","desc_es":"La Orden Ejecutiva 9066, firmada en 1942. Autorizó el traslado forzoso y el encarcelamiento de 120,000 japoneses americanos - dos tercios de ellos ciudadanos estadounidenses. La Corte Suprema la respaldó. Nunca fue completamente anulada.","do_en":"","do_es":"Estás nombrando un abuso de poder. Cuando el gobierno usa su poder para dañar a las personas, los ciudadanos pueden resistir mediante la organización, los desafíos legales y dar testimonio. En la vida real: contacta a la ACLU en aclu.org. Habla en una audiencia pública. Escríbele a tu representante. Escribe tu resistencia aquí. Luego envía RESISTIR al 50409.","submit_template_es":"Me negaría a aceptar ___ en nombre de la seguridad nacional\n\nMi petición a mis representantes: ___."},{"id":124,"type":"Expansive","title":"Executive Order 8802","prompt":"A. Philip Randolph threatened to march 100,000 Black workers to Washington to force the president to ban discrimination in defense industries. The threat worked. Have you ever seen collective power change something? Write what it was. Then write what a march of 100,000 people should demand today.","do":"Name one protection that should be required by executive order and doesn't exist yet.","submit_template":"The president can order fairness in federal hiring with one signature. I want my representatives to push for an executive order ending discrimination in all federal contracts right now.","desc_en":"Executive Order 8802, signed in 1941. It banned discrimination in defense industries - the first federal civil rights protection since Reconstruction. A. Philip Randolph won it by threatening to march 100,000 Black workers on Washington.","desc_es":"La Orden Ejecutiva 8802, firmada en 1941. Prohibió la discriminación en las industrias de defensa - la primera protección federal de derechos civiles desde la Reconstrucción. A. Philip Randolph la ganó amenazando con marchar con 100,000 trabajadores negros hacia Washington.","do_en":"","do_es":"Estás exigiendo acción ejecutiva. Los presidentes pueden actuar solos mediante órdenes ejecutivas. A. Philip Randolph amenazó con marchar con 100,000 personas hacia Washington - y el Presidente Roosevelt firmó una orden ejecutiva. La presión organizada funciona. En la vida real: contacta a la Casa Blanca en whitehouse.gov/contact. Envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"La orden ejecutiva que exigiría: ___\n\nMi petición a mis representantes: ___."},{"id":125,"type":"Expansive","title":"Title IX implementing regulations","prompt":"Title IX bans sex discrimination in schools. It took three years of organizing just to write the actual rules. Think about a rule you think exists but has never been enforced. Write what the rule is and what enforcing it would look like.","do":"Name a law on the books that isn't being enforced - and who it affects.","submit_template":"Schools still cut girls' sports programs and look the other way on harassment. I want my representatives to enforce Title IX with real consequences for schools that break the law.","desc_en":"The Title IX implementing regulations of 1975. Title IX banned sex discrimination in schools - but it took three years and sustained pressure from women's groups before the government wrote the rules that actually made it enforceable.","desc_es":"Los reglamentos de implementación del Título IX de 1975. El Título IX prohibió la discriminación por sexo en las escuelas - pero tomó tres años y presión sostenida de grupos de mujeres antes de que el gobierno escribiera las reglas que lo hicieron realmente aplicable.","do_en":"","do_es":"Estás exigiendo cumplimiento. Tener una ley no es lo mismo que hacerla cumplir. Los ciudadanos han obligado a los gobiernos a actuar mediante presión organizada, sentadas, desafíos legales y haciéndolo imposible de ignorar. En la vida real: presenta una queja ante la agencia federal correspondiente o contacta a tu representante. Envía RESISTIR al 50409.","submit_template_es":"___ es una ley que no se está aplicando. Afecta a ___\n\nMi petición a mis representantes: ___."},{"id":126,"type":"Expansive","title":"Treaty or agreement specific to Lenape land (NYC) - source TBD","prompt":"The land this installation stands on was the homeland of the Lenape people before it was New York City. Write one thing you did not know about the land where you live and who lived there before. Then write what you think should be different about how that history is taught.","do":"Learn whose land this is. Then write one obligation you will carry.","submit_template":"I live on land that was taken without consent. I want my representatives to work with the Lenape Nation to honor what the government promised and then broke.","desc_en":"A treaty or agreement related to Lenape land - the Indigenous nation whose homeland includes what is now New York City. You are standing on it. Source still being confirmed.","desc_es":"Un tratado o acuerdo relacionado con la tierra Lenape - la nación indígena cuyo territorio incluye lo que hoy es la ciudad de Nueva York. Estás parado/a en ella. Fuente aún por confirmar.","do_en":"","do_es":"Estás reconociendo una reclamación de tierra. Las reclamaciones de tierra indígena existen en la ley y en los marcos internacionales de derechos humanos. El movimiento Land Back afirma estos derechos hoy. En la vida real: aprende de quién es la tierra en la que estás en native-land.ca. Apoya organizaciones lideradas por indígenas. Este reconocimiento es el comienzo de la responsabilidad. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"Estoy en tierra ___. Mi obligación es ___\n\nMi petición a mis representantes: ___."},{"id":127,"type":"Expansive","title":"Treaty of Fort Laramie","prompt":"The US promised the Lakota Nation the Black Hills forever. It broke that promise in eight years when gold was found. The Supreme Court ruled the seizure was illegal in 1980. The Lakota refused the money and still demand the land. Write one promise you think the United States should keep that it has not.","do":"Talk to the person next to you. Write the promise.","submit_template":"The United States has broken nearly every treaty it signed with Native nations. I want my representatives to honor what is left of those agreements and stop breaking new ones.","desc_en":"The Treaty of Fort Laramie, signed in 1868. The United States promised the Lakota nation their land forever. Within a decade, gold was discovered in the Black Hills - and the US took the land back.","desc_es":"El Tratado de Fort Laramie, firmado en 1868. Los Estados Unidos prometieron a la nación Lakota su tierra para siempre. En una década, se descubrió oro en las Black Hills - y los EE. UU. tomaron la tierra de vuelta.","do_en":"","do_es":"Estás reconociendo una reclamación de tierra. Las reclamaciones de tierra indígena existen en la ley y en los marcos internacionales de derechos humanos. El movimiento Land Back afirma estos derechos hoy. En la vida real: aprende de quién es la tierra en la que estás en native-land.ca. Apoya organizaciones lideradas por indígenas. Este reconocimiento es el comienzo de la responsabilidad. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"Una promesa que fue rota: ___\n\nMi petición a mis representantes: ___."},{"id":128,"type":"Expansive","title":"Treaty of New Echota","prompt":"The Trail of Tears happened because a small group signed away land that was not theirs to give. Write about a time a decision was made that affected your community without your consent. Then write one rule about who gets to speak for a group.","do":"Think of a contract, agreement, or policy you signed or accepted under conditions you didn't choose. Write about it.","submit_template":"Thousands of Cherokee people died on the Trail of Tears because the government forced through a treaty and then ignored it. I want my representatives to restore tribal land rights and sovereignty.","desc_en":"The Treaty of New Echota, signed in 1835. A small group of Cherokee men - without authority from the Cherokee Nation - signed away their homeland. The entire nation was forcibly removed in the Trail of Tears.","desc_es":"El Tratado de New Echota, firmado en 1835. Un pequeño grupo de hombres cherokee - sin autoridad de la Nación Cherokee - cedió su tierra natal. Toda la nación fue trasladada por la fuerza en el Sendero de las Lágrimas.","do_en":"","do_es":"Estás nombrando un acuerdo forzado. Muchos acuerdos - tratados, contratos, políticas - son firmados bajo condiciones que las personas no eligieron. Nombrar esto es como comienza la responsabilidad. Escribe tu respuesta aquí. Aprende de quién es la tierra en la que estás en native-land.ca. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"Acepté ___ bajo condiciones que no elegí\n\nMi petición a mis representantes: ___."},{"id":129,"type":"Expansive","title":"Dred Scott v. Sandford","prompt":"In 1857, the Supreme Court ruled that Black people were not citizens and had no rights the government was bound to respect. That ruling was overturned by the 14th Amendment. Write the name of a group you think the law still does not fully protect. Then write what equal protection would look like for them.","do":"Name it. State why in one sentence.","submit_template":"The Supreme Court once ruled that Black people had no rights the government had to respect. I want my representatives to make sure that kind of ruling can never happen again.","desc_en":"Dred Scott v. Sandford, decided in 1857. The Supreme Court ruled that Black people were not citizens and had no rights the government was bound to respect. It was one of the worst decisions in Court history. It was overturned by the 13th and 14th Amendments.","desc_es":"Dred Scott contra Sandford, decidido en 1857. La Corte Suprema dictaminó que los negros no eran ciudadanos y no tenían derechos que el gobierno estuviera obligado a respetar. Fue una de las peores decisiones en la historia de la Corte. Fue anulada por las Enmiendas 13 y 14.","do_en":"","do_es":"Estás registrando disenso. El disenso es discrepar públicamente de una decisión tomada por quienes tienen el poder. Es un discurso protegido. Los ciudadanos han desafiado sentencias judiciales injustas mediante la organización, la legislación y nuevos casos legales. En la vida real: contacta a la ACLU en aclu.org. Escribe tu disenso aquí. Luego envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"El fallo que creo que está mal: ___. Porque ___\n\nMi petición a mis representantes: ___."},{"id":130,"type":"Expansive","title":"Plessy v. Ferguson","prompt":"Separate but equal was the law for 58 years. Spend two minutes with the people around you. Ask: where do you see separate and unequal right now, in schools, in housing, in health care, anywhere? Agree on one example and all submit it.","do":"Name it. Talk to the person next to you: do they see it too?.","submit_template":"Separate is never equal, and unequal school funding proves it every day. I want my representatives to fund every public school equally so every child gets the same start.","desc_en":"Plessy v. Ferguson, decided in 1896. The Supreme Court ruled that 'separate but equal' was constitutional. This decision justified legal segregation for 58 years, until Brown v. Board of Education in 1954.","desc_es":"Plessy contra Ferguson, decidido en 1896. La Corte Suprema dictaminó que 'separado pero igual' era constitucional. Esta decisión justificó la segregación legal durante 58 años, hasta Brown contra la Junta de Educación en 1954.","do_en":"","do_es":"Estás nombrando una estructura separada pero desigual que aún existe. Plessy fue anulado en la ley - pero la separación y la desigualdad todavía están integradas en muchos sistemas. Nombra uno. Habla con la persona a tu lado. Luego envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"La estructura separada pero desigual en mi comunidad: ___\n\nMi petición a mis representantes: ___."},{"id":131,"type":"Expansive","title":"Korematsu v. United States","prompt":"The Supreme Court upheld Japanese American incarceration in 1944. It took 74 years for the court to formally say it was wrong. Write one thing the government is doing right now that you believe future generations will look back on as a serious mistake.","do":"Name it. Say it out loud to the person next to you.","submit_template":"The Supreme Court upheld Japanese internment and has never formally overturned it. I want my representatives to pass a law making clear that mass detention based on race or religion is unconstitutional.","desc_en":"Korematsu v. United States, decided in 1944. The Supreme Court upheld the imprisonment of Japanese Americans. In 2018, the Court formally said this decision was wrong - but the executive order that enabled it was never struck down.","desc_es":"Korematsu contra Estados Unidos, decidido en 1944. La Corte Suprema respaldó el encarcelamiento de los japoneses americanos. En 2018, la Corte dijo formalmente que esta decisión estuvo mal - pero la orden ejecutiva que la habilitó nunca fue anulada.","do_en":"","do_es":"Estás registrando disenso. El disenso es discrepar públicamente de una decisión tomada por quienes tienen el poder. Es un discurso protegido. Los ciudadanos han desafiado sentencias judiciales injustas mediante la organización, la legislación y nuevos casos legales. En la vida real: contacta a la ACLU en aclu.org. Escribe tu disenso aquí. Luego envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"Me negaría a aceptar ___ en nombre de la seguridad nacional\n\nMi petición a mis representantes: ___."},{"id":132,"type":"Expansive","title":"Declaration of Sentiments","prompt":"In 1848, Elizabeth Cady Stanton rewrote the Declaration of Independence replacing 'men' with 'men and women' and listing women's grievances. Rewrite one sentence. Take the phrase 'all men are created equal' and finish it the way you believe it should read in 2024. Write your version.","do":"Write one sentence in the form of the Declaration - 'He/She/They/It has never permitted me to ___.'.","submit_template":"Women were written out of the Declaration of Independence on purpose. I want my representatives to pass the Equal Rights Amendment so the Constitution finally protects everyone.","desc_en":"The Declaration of Sentiments, written in 1848. Elizabeth Cady Stanton rewrote the Declaration of Independence word for word - substituting women for the colonists. It listed 18 grievances about the exclusion of women from public life.","desc_es":"La Declaración de Sentimientos, escrita en 1848. Elizabeth Cady Stanton reescribió la Declaración de Independencia palabra por palabra - sustituyendo a las mujeres por los colonos. Enumeró 18 quejas sobre la exclusión de las mujeres de la vida pública.","do_en":"","do_es":"Estás escribiendo tu propia declaración. Stanton tomó el documento fundacional y cambió para quién era. Toma cualquier oración de él y hazla tuya - cambia el sujeto, cambia la queja, hazla verdadera para tu vida. Escríbela aquí. Luego llévala más lejos: envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"___ nunca me ha permitido ___\n\nMi petición a mis representantes: ___."},{"id":133,"type":"Expansive","title":"Frederick Douglass, 'What to the Slave Is the Fourth of July?'","prompt":"In 1852, Frederick Douglass asked what the Fourth of July means to a person who is enslaved. Ask yourself: what does this country's most celebrated freedom mean to someone who does not have it? Write your answer, or write one freedom you think is celebrated but not yet real for everyone.","do":"Complete this sentence out loud - then write it: 'What, to ___, is your ___?'.","submit_template":"Freedom means something different depending on who you are in this country. I want my representatives to take seriously the parts of American history we have not yet made right.","desc_en":"Frederick Douglass's speech 'What to the Slave Is the Fourth of July?', delivered in 1852. Douglass - who had escaped slavery - asked what the promise of American freedom meant to the people it excluded. It is one of the greatest speeches in American history.","desc_es":"El discurso de Frederick Douglass '¿Qué es el 4 de julio para el esclavo?', pronunciado en 1852. Douglass - quien había escapado de la esclavitud - preguntó qué significaba la promesa de libertad americana para las personas que excluía. Es uno de los grandes discursos de la historia americana.","do_en":"","do_es":"Estás haciendo una declaración pública. Una declaración es una afirmación de lo que crees y lo que exiges. Douglass y Stanton no pidieron permiso - escribieron la verdad y pusieron sus nombres. Escribe la tuya aquí. Luego llévala más lejos: envía RESISTIR al 50409, o envíala a tu periódico local como carta al editor. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"¿Qué es ___ para ___?\n\nMi petición a mis representantes: ___."},{"id":134,"type":"Expansive","title":"Sojourner Truth, 'Ain't I a Woman?'","prompt":"Sojourner Truth was told she was not really a woman, because she was Black and had worked like a man. She asked: ain't I a woman? Write about a time you were told you did not belong in a category you knew you belonged in. Or write a question you want the people in power to have to answer.","do":"Say it out loud. To the person next to you. Then write it.","submit_template":"Black women are still paid less and protected less than almost anyone else in this country. I want my representatives to pass pay equity laws with real enforcement and real penalties.","desc_en":"Sojourner Truth's 'Ain't I a Woman?' speech, delivered in 1851. Truth - a Black woman who had been enslaved - stood up at a women's rights convention and challenged people who doubted her humanity and her right to speak.","desc_es":"El discurso '¿Acaso no soy una mujer?' de Sojourner Truth, pronunciado en 1851. Truth - una mujer negra que había sido esclavizada - se levantó en una convención de derechos de la mujer y desafió a las personas que dudaban de su humanidad y su derecho a hablar.","do_en":"","do_es":"Estás dando testimonio. Dar testimonio significa decir en voz alta lo que has visto o experimentado - y hacer que otros también lo vean. Las palabras de Truth cambiaron la sala. Las tuyas también pueden. Escribe lo que necesita ser visto aquí. Luego llévalo más lejos: habla en una audiencia pública, o envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"¿Acaso no soy ___?\n\nMi petición a mis representantes: ___."},{"id":135,"type":"Expansive","title":"Chief Joseph, surrender speech","prompt":"Chief Joseph said 'I will fight no more forever' after 1,400 miles of retreat. Write about a time you, or someone you know, had to stop fighting for something even though the fight was not finished. What would it take to start again?","do":"Name it. Say it to the person next to you.","submit_template":"The Nez Perce were promised their land and had it taken anyway. I want my representatives to restore federal recognition and land rights for Native nations whose treaties were broken.","desc_en":"Chief Joseph's surrender speech, delivered in 1877 after a 1,400-mile retreat. Chief Joseph of the Nez Perce was surrounded by the US Army. He said he would fight no more - not because he stopped caring, but because he had nothing left to fight with. He never returned to his homeland.","desc_es":"El discurso de rendición del Jefe Joseph, pronunciado en 1877 después de una retirada de 1,400 millas. El Jefe Joseph de los Nez Perce estaba rodeado por el ejército de los EE. UU. Dijo que no lucharía más - no porque dejara de importarle, sino porque no le quedaba nada con qué luchar. Nunca regresó a su tierra natal.","do_en":"","do_es":"Estás dando testimonio. Dar testimonio significa decir en voz alta lo que has visto o experimentado - y hacer que otros también lo vean. Las palabras de Truth cambiaron la sala. Las tuyas también pueden. Escribe lo que necesita ser visto aquí. Luego llévalo más lejos: habla en una audiencia pública, o envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"Dejé de luchar por ___ cuando me quedé sin ___\n\nMi petición a mis representantes: ___."},{"id":136,"type":"Expansive","title":"Section 504 Sit-in demands","prompt":"Disability rights activists occupied a federal building for 26 days to force the government to implement a law it had already passed. Write a demand to the government right now about a law that exists but is not being enforced. Submit it here and through Resistbot.","do":"Name it. Write your dem.","submit_template":"Disabled Americans sat in a federal building for 25 days to make the government follow its own law. I want my representatives to fully fund ADA and Section 504 enforcement so no one has to do that again.","desc_en":"The demands of the Section 504 sit-in, 1977. Disability rights activists occupied a federal building for 26 days - the longest such occupation in US history - to force the government to implement a law that was already on the books but had never been enforced.","desc_es":"Las demandas de la sentada de la Sección 504, 1977. Activistas por los derechos de las personas con discapacidad ocuparon un edificio federal durante 26 días - la ocupación más larga de este tipo en la historia de los EE. UU. - para obligar al gobierno a implementar una ley que ya estaba en los libros pero que nunca había sido aplicada.","do_en":"","do_es":"Estás haciendo una exigencia. Los activistas de la Sección 504 no pidieron amablemente - se quedaron hasta que la ley fue aplicada. Una exigencia no es una solicitud. Escribe la tuya aquí. Luego llévala más lejos: envía RESISTIR al 50409 y envía tu exigencia a tu representante.","submit_template_es":"La ley que no se está aplicando: ___. Mi exigencia: ___\n\nMi petición a mis representantes: ___."},{"id":137,"type":"Expansive","title":"Poor People's Campaign demands","prompt":"The Poor People's Campaign brought together poor people of all races to demand jobs, income, land, and a voice. Turn to the person next to you. Ask: what do you think every person in this country deserves, no matter who they are? Write what you both agree on and submit it.","do":"Name the one you most need. Add it to the demand list.","submit_template":"40 million Americans live in poverty in the wealthiest country in history. I want my representatives to pass a living wage and guaranteed healthcare for every person.","desc_en":"The Economic Bill of Rights demanded by the Poor People's Campaign in 1968. Dr. Martin Luther King Jr. and the SCLC brought thousands to Washington to demand five things as rights - not charity: a job, an income, housing, land, and a voice in the decisions that affect you.","desc_es":"La Carta de Derechos Económicos exigida por la Campaña de los Pobres en 1968. El Dr. Martin Luther King Jr. y la SCLC llevaron a miles de personas a Washington para exigir cinco cosas como derechos - no como caridad: un empleo, un ingreso, vivienda, tierra y una voz en las decisiones que te afectan.","do_en":"","do_es":"Estás haciendo una exigencia. Una exigencia es una declaración colectiva de que algo debe cambiar. La mayoría de la legislación importante - la Ley de Derechos Civiles, la Ley de Derechos de Voto, la ADA - sucedió porque personas organizadas hicieron exigencias y siguieron haciéndolas. En la vida real: únete a una campaña existente o inicia una. La Campaña de los Pobres está activa hoy en poorpeoplescampaign.org. Envía RESISTIR al 50409. Luego escribe qué quieres que hagan tus representantes al respecto.","submit_template_es":"Exijo ___\n\nMi petición a mis representantes: ___."}];

// ── Content filter ───────────────────────────────────────────────────────────
const _filter = (() => {
  try {
    const f = new BadWords();
    // Allow words that may appear legitimately in civic/rights responses
    f.removeWords('sex', 'sexy', 'hell', 'damn', 'god', 'jesus', 'prick', 'homo');
    return f;
  } catch(e) { return null; }
})();

function contentFilter(text) {
  if (text.trim().length < 8) return 'Please write at least a sentence.';

  // Repeated word spam
  const words = text.toLowerCase().split(/\s+/);
  const freq = {};
  for (const w of words) freq[w] = (freq[w] || 0) + 1;
  if (Object.values(freq).some(c => c >= 4) && words.length < 20)
    return 'Please write a real response.';

  // bad-words library check
  if (_filter) {
    try {
      if (_filter.isProfane(text))
        return 'Your response contains language not suitable for this installation. Please revise.';
    } catch(e) {}
  }

  return null;
}

async function handleSubmit(doc) {
  // Re-check AI server health in case it came up after page load
  await checkHealth();

  const response  = document.getElementById('response').value.trim();
  const firstName = (document.getElementById('first_name')?.value || '').trim() || null;
  const visitorZip = (document.getElementById('zip_input')?.value || '').trim().replace(/[^0-9-]/g,'').slice(0,10) || null;

  if (!response) { showErr(t('error_response')); return; }
  const filterMsg = contentFilter(response);
  if (filterMsg)  { showErr(filterMsg); return; }
  if (!visitorZip) { showErr(t('error_zip')); return; }

  const payload = {
    doc_id:            doc.id,
    doc_title:         doc.title,
    response_text:     response,
    submit_template:   doc.submit_template || null,
    first_name:        firstName,
    installation_name: CONFIG.INSTALLATION_NAME,
    visitor_zip:       visitorZip,
    consented:         true,
    ui_language:       lang,
  };



  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = t('submitting');
  clearErr();

  try {
    let ok = false;
    if (CONFIG.SUPABASE_URL && !CONFIG.SUPABASE_URL.startsWith('__')) {
      ok = await toSupabase(payload);
    } else if (CONFIG.FORMSPREE_ID && !CONFIG.FORMSPREE_ID.startsWith('__')) {
      ok = await toFormspree(payload);
    } else {
      console.log('[PR] No backend. Payload:', payload);
      ok = true;
    }
    if (ok) {
      document.getElementById('main-view').style.display = 'none';
      document.getElementById('success-view').style.display = 'block';
      document.getElementById('success-text').textContent = '\u201c' + response + '\u201d';
      const isUS = /^\d{5}$/.test(visitorZip || '');
      showResistbot(isUS, visitorZip, response);
      // Pre-fill Resistbot SMS link with their response - passive, user taps when ready
      const smsWord = lang === 'es' ? 'RESISTIR' : 'RESIST';
      const smsBtn = document.getElementById('resistbot-sms-btn');
      if (smsBtn) smsBtn.href = 'sms:50409?body=' + encodeURIComponent(smsWord + '\n\n' + response);
      updateSuccessLang();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      fetchEcho(response, doc.id);
      // fetchClusters(); // saved for thermal printout / future use
    } else { throw new Error('failed'); }
  } catch (e) {
    btn.disabled = false;
    btn.textContent = t('submit_btn');
    showErr(t('error_generic'));
    console.error(e);
  }
}

function updateSuccessLang() {
  const sv = document.getElementById('success-view');
  if (!sv || sv.style.display === 'none') return;
  const set = (id, prop, val) => { const el = document.getElementById(id); if (el) el[prop] = val; };
  set('success-title',   'textContent', t('success_title'));
}

async function fetchEcho(text, docId) {
  const block = document.getElementById('echo-block');
  const loading = document.getElementById('echo-loading');
  if (!CONFIG.AI_URL || !CONFIG.aiOnline) {
    if (block) block.innerHTML = '<div class="ai-offline" id="echo-offline">' + t('ai_offline') + '</div>';
    return;
  }
  try {
    const r = await fetch(CONFIG.AI_URL + '/echo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, doc_id: docId }),
      signal: AbortSignal.timeout(8000)
    });
    if (!r.ok) throw new Error('echo failed');
    const d = await r.json();
    // Use AI-generated echo if available, fall back to hardcoded
    const echoText = d.generated_echo
      ? esc(d.generated_echo)
      : 'Your idea is connected to <strong>' + esc(d.match_title) + '</strong>, already hanging in this installation. People who believed the same thing kept sending it to their representatives until it changed the law. Find it, scan its QR code, and see what question it is still trying to answer.';
    block.innerHTML =
      '<div class="echo-intro">' + echoText + '</div>' +
      '<div class="echo-clause">' + esc(d.match_clause) + '</div>';
  } catch (e) {
    block.innerHTML = '<div class="ai-offline">' + t('ai_offline') + '</div>';
  }
}

async function fetchClusters() {
  const block = document.getElementById('clusters-block');
  if (!CONFIG.AI_URL || !CONFIG.aiOnline) {
    if (block) block.innerHTML = '<div class="ai-offline">' + t('ai_offline') + '</div>';
    return;
  }
  try {
    const r = await fetch(CONFIG.AI_URL + '/clusters', {
      signal: AbortSignal.timeout(5000)
    });
    if (!r.ok) throw new Error('clusters failed');
    const d = await r.json();
    if (!d.clusters || !d.clusters.length) {
      block.innerHTML = '<div class="ai-offline">' + t('no_submissions_yet') + '</div>';
      return;
    }
    block.innerHTML = d.clusters.map(c =>
      '<div class="cluster-pill">' +
        '<span class="cluster-count">' + c.count + '</span>' +
        '<span class="cluster-theme">' + esc(c.theme) + '</span>' +
      '</div>'
    ).join('');
  } catch (e) {
    block.innerHTML = '<div class="ai-offline">' + t('ai_offline') + '</div>';
  }
}


async function toSupabase(payload) {
  const r = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/submissions`, {
    method: 'POST',
    headers: {
      'Content-Type':  'application/json',
      'apikey':        CONFIG.SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${CONFIG.SUPABASE_ANON_KEY}`,
      'Prefer':        'return=minimal',
    },
    body: JSON.stringify(payload),
  });
  if (!r.ok) {
    const body = await r.text().catch(() => '(no body)');
    console.error('[PR] Supabase error', r.status, r.statusText, body);
  }
  return r.ok;
}

async function toFormspree(payload) {
  const r = await fetch(`https://formspree.io/f/${CONFIG.FORMSPREE_ID}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(payload),
  });
  return r.ok;
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function clearErr() {
  const el = document.getElementById('err');
  if (el) { el.style.display = 'none'; el.textContent = ''; }
}
function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;')
          .replace(/\n/g,' ');
}
